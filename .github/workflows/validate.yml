name: Validate card
on:
  push:
    branches: [dev, beta, main]
  pull_request:
jobs:
  marketplace:
    name: HACS Marketplace validation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate dashboard card and screenshots
        uses: hacs/action@main
        with:
          category: plugin
          comment: "false"
  screenshots:
    name: Check README screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify screenshot assets and README references
        run: |
          test -s images/senso4s-mini.png
          test -s images/senso4s-standard.png
          grep -Fq '](images/senso4s-mini.png)' README.md
          grep -Fq '](images/senso4s-standard.png)' README.md
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled translations
        run: node scripts/build.mjs --check
      - name: Check JavaScript syntax
        run: |
          node --check senso4s-card.js
          node --check senso4s-basic-card.js
      - name: Run frontend component tests
        run: node --test tests/*.test.cjs
      - name: Validate HACS metadata
        run: node -e "const f=require('./hacs.json'); if(f.name!=='Senso4s Card'||f.filename!=='senso4s-card.js'||f.content_in_root!==true) process.exit(1)"
      - name: Reject Wecamp coupling
        run: '! grep -i "wecamp" senso4s-card.js'
